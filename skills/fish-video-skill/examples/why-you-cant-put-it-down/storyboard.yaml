title: Why your phone is so hard to put down
style: paper-collage
bpm: 120
hud:
  chapter: false
  rail: true
anchor:
  src: assets/cut/phone.png
  corner: tr
  w: 0.17
scenes:
- id: hook
  type: collage
  camera:
    preset: drift+dolly-in+orbit-right
    amount: 0.6
  say: You don't keep checking your phone because it's good. You check because you never know what's next.
  cues:
  - lt: 0
    type: impact
  params:
    title: YOU NEVER KNOW WHAT'S *NEXT*
    title_at: 0
    items:
    - src: assets/cut/phone.png
      kind: cutout
      x: 0.52
      y: 0.56
      w: 0.86
      at: 0
      outline: 6
      z: 50
    labels:
    - text: good
      x: 0.06
      y: 0.34
      size: 58
      at: 2.2
      rot: -5
      arrow:
        to: 0
        bend: 0.3
    - text: unknown
      x: 0.97
      y: 0.74
      align: right
      size: 70
      at: 5.5
      rot: 4
      color: accent
      arrow:
        to: 0
        bend: -0.3
  mood: curious
- id: lab
  type: collage
  transition: match
  camera:
    preset: drift+dolly-in
    amount: 0.5
    keys:
    - t: 0
      focus_z: 40
  say: In lab experiments, animals rewarded at random responded fastest. And when the rewards stopped, they kept going longest.
  params:
    title: RANDOM *REWARDS*
    title_at: 0
    items:
    - src: assets/cut/pigeon.png
      kind: cutout
      x: 0.5
      y: 0.46
      w: 0.8
      at: 0.4
      outline: 6
      z: 40
    labels:
    - text: fastest
      x: 0.04
      y: 0.67
      size: 62
      at: 3.4
      rot: -4
      arrow:
        to: 0
        bend: 0.35
    - text: longest
      x: 0.96
      y: 0.69
      align: right
      size: 70
      at: 6.6
      rot: 3
      color: accent
      arrow:
        to: 0
        bend: -0.3
  mood: neutral
- id: slot
  type: split
  transition: zoom
  camera_shake: 0.3
  camera_shake_on: impact
  say: Slot machines pay out on exactly that schedule. Most pulls give you nothing. The next one might.
  params:
    at: 9.7
    front:
      src: assets/photo/wikimedia-103874436.jpg
      title: 'MOST PULLS: *NOTHING*'
      tag: SLOT MACHINE
    back:
      kicker: But
      title: THE NEXT ONE *MIGHT*
  mood: tense
- id: loop
  type: neonline
  accent: '#19b5c9'
  transition: flash
  say: Your feed feels the same. A buzz. You check. Sometimes, something great. So you go again.
  params:
    kicker: The loop
    title: BUILT TO *REPEAT*
    at: 1.2
    seg: 0.9
    steps:
    - label: Buzz
      icon: bell
    - label: Check
      icon: repeat
    - label: Something
      icon: star
    - label: Again
      icon: flame
  mood: urgent
- id: turn
  type: cone
  accent: '#f2b705'
  transition: defocus
  camera_from: prev
  camera_blend: 1.0
  cues:
  - lt: 0.9
    type: riser
    len: 0.9
  say: So when you can't put it down, that's not only weak willpower. It's a schedule doing its job.
  params:
    title: 'NOT ONLY WILLPOWER.

      A *SCHEDULE.*'
    at: 0.6
  mood: serious
- id: payoff
  type: collage
  transition: zoom
  camera:
    preset: drift+dolly-out
    amount: 0.5
  cues:
  - lt: 0.2
    type: boom
  say: So take away the surprise. Turn off the pings, and check at set times. Less surprise, less pull.
  params:
    title: LESS SURPRISE. LESS *PULL.*
    title_at: 0
    items:
    - src: assets/cut/brain.png
      kind: cutout
      x: 0.42
      y: 0.4
      w: 0.64
      at: 0.3
      outline: 6
      z: 30
    - src: assets/cut/phone.png
      kind: cutout
      x: 0.72
      y: 0.74
      w: 0.4
      at: 2.4
      outline: 5
      z: 40
      rot: 8
    labels:
    - text: pings off
      x: 0.04
      y: 0.68
      size: 58
      at: 2.8
      rot: -4
      arrow:
        to: 1
        bend: 0.3
    - text: set times
      x: 0.96
      y: 0.3
      align: right
      size: 58
      at: 4.2
      rot: 3
      color: accent
      arrow:
        to: 0
        bend: -0.3
    lines:
    - - 0
      - 1
  mood: warm
- id: end
  type: end
  transition: match
  say: Follow for more on how your brain really works.
  params:
    name: Why you can't put it down
    tagline: How your brain really works.
    cta: Follow for more
  mood: warm
captures: []
thumbnail:
  kicker: How your brain works
  title: Why you can't put it down
  accent: can't
  badge: Short
