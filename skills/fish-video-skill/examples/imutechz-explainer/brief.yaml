# The brief that reproduces the ImuTechz explainer (Promotion/Project 2) with this skill.
#   fishvideo all examples/imutechz-explainer
# Needs the ImuTechz site (dev server http://localhost:3000, or https://www.imutechz.in)
# for the tour captures. The facts below are the ones the original video used, with sources.
title: "IMURUN: local-first AI with its own engine"
package_name: "ImuTechz explainer"
prompt: "A 2:40 YouTube explainer + a LinkedIn 4:5 cut: what IMURUN is, how the FISH engine works (whiteboard), agents, and a tour of the new imutechz.in. Indian English voice."
goal: explain
audience: "developers who run models locally; people curious about ImuTechz"
structure: explainer
length: 200            # the original cut ran 2:40 with denser pacing; narration timing decides the final length
platforms: [youtube, linkedin]
language: en-IN
tone: "calm, exact, a little playful; no hype"

brand:
  name: ImuTechz
  url: imutechz.in
  tagline: "Open-source R&D, built in public."
  logo: ""                       # put the Aperture mark export at assets/aperture.svg to use it
  mode: light
  colors: {bg: "#f3ede2", surface: "#faf7f0", paper: "#f8f4ec", ink: "#1a1714", fg: "#1c1915", muted: "#58524a", dim: "#847c70", accent: "#d9481e", accent2: "#15858d"}
  fonts: {sans: Inter, serif: Fraunces, mono: JetBrains Mono, hand: Caveat}

points:
  - "IMURUN runs in one process on your machine"
  - "FISH keeps weights quantised and computes in int8"
  - "Agents ask before they act"
  - "The new imutechz.in: docs, directory, R&D"

facts:
  - {text: "IMURUN v0.3.0, MIT licence", value: "0.3.0", source: "https://github.com/shubham001312/imurun"}
  - {text: "AVX2 integer dot products run 2.1x faster than the f32 path per Q4_K row (Ryzen 7 7435HS)", value: "2.1", source: "https://imutechz.in/imu (FISH benchmark note)"}
  - {text: "Q4_K stores about 4.5 bits per weight in 256-weight super-blocks", value: "4.5", source: "https://imutechz.in/imu/docs"}
  - {text: "8 connectors plus any MCP server", value: "8", source: "https://imutechz.in/imu"}
  - {text: "23 docs guides", value: "23", source: "https://imutechz.in/imu/docs"}
  - {text: "10,631 agents and skills in the directory", value: "10,631", source: "https://imutechz.in/agents"}
  - {text: "5 open-source R&D tracks", value: "5", source: "https://imutechz.in/research"}
  - {text: "7 parts in one window", value: "7", source: "https://imutechz.in/imu"}

sources:
  - https://www.imutechz.in/
  - https://www.imutechz.in/imu
  - https://www.imutechz.in/imu/docs
  - https://github.com/shubham001312/imurun

website:
  url: http://localhost:3000
  theme: light
  storage: {imu-theme: light}
  hide: [".intro-skip"]

cta: {text: "pip install imurun", url: "https://github.com/shubham001312/imurun"}

voice:
  provider: elevenlabs
  language: en-IN
  elevenlabs: {voice_id: fydPJq00SigRIaPxWgiS}
  fallback: {provider: edge-tts, voice: en-IN-NeerjaNeural, rate: "-6%"}
  pronunciations:
    IMURUN: "Imu run"
    imurun: "Imu run"
    ImuTechz: "Imu techs"
    imutechz.in: "Imu techs dot in"
    FISH: "Fish"
    GGUF: "G G U F"
    AVX2: "A V X 2"
    f32: "F thirty-two"
    int8: "int eight"
    matmul: "mat-mul"
    "C++": "C plus plus"
    KV: "K V"
    MCP: "M C P"
    LoRA: "Lora"
    Qwen: "Kwen"
    Phi: "Fye"
    "R&D": "R and D"
    npx: "N P X"

score: {key: D, mode: minor, progression: i-VI-III-VII, seed: 12345}
hashtags: [LocalAI, OpenSource, LLM, GGUF, IMURUN, ImuTechz]
