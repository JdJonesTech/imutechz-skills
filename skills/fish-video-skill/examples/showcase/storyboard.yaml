# How a habit forms: six scenes, 13 bars (26 s at 120 BPM), no narration.
# `caption:` puts on-screen pop captions on a silent scene (captions.style: pop in the brief).
# Camera: every scene uses its style's preset unless it sets `camera:`; see the Camera section of
# references/scene-catalogue.md. This cut shows a dolly + orbit, a rack focus (split), a shake kick
# on the split's impact, a push-through (repeat) and one move that carries through a cut (close: camera_from: prev).
title: "How a habit forms"
bpm: 120
hud: {chapter: false, rail: true}
scenes:
  - id: hook
    type: collage
    bars: 3
    caption: "Most of your day runs on autopilot."
    camera: {preset: drift+dolly-in+orbit-right, amount: 0.55}   # paper style + a slow orbit: parallax between the layers
    params:
      title: "YOUR BRAIN RUNS ON *AUTOPILOT*"
      items:
        - {src: assets/person.svg, kind: cutout, x: 0.5, y: 0.66, w: 0.62, ratio: 1.25, at: 1, outline: 6, z: 40}
        - {src: assets/clock.svg, shape: octagon, x: 0.2, y: 0.42, w: 0.36, ratio: 1.0, rot: -7, at: 2, tag: CUE, z: -120}
        - {src: assets/phone.svg, shape: chamfer, x: 0.82, y: 0.46, w: 0.32, ratio: 1.15, rot: 6, at: 2.6, tag: REFLEX, z: -60}
      labels:
        - {text: "the trigger", x: 0.02, y: 0.66, size: 54, at: 3.6, rot: -4, arrow: {to: 1, bend: 0.35}}
        - {text: "the reflex", x: 0.98, y: 0.7, align: right, size: 54, at: 4.4, rot: 3, arrow: {to: 2, bend: -0.35}}
      lines: [[0, 1], [0, 2]]

  - id: split
    type: split
    bars: 2
    transition: zoom                  # a portal: the camera flies into the hook, then pulls back out of the split
    caption: "Willpower fades. Systems stay."
    camera_shake: 0.35
    camera_shake_on: impact
    camera:                           # rack focus: the front card (z 30) is sharp, then focus pulls to the back layer (z -90)
      preset: drift
      keys:
        - {t: 0, focus_z: 30}
        - {t: 1.0, focus_z: 30}
        - {t: 1.6, focus_z: -90, ease: cubic}
    params:
      at: 2.2
      front: {src: assets/phone.svg, title: "WILLPOWER", tag: "PLAN A"}
      back: {kicker: "PLAN B", title: "*SYSTEMS*", sub: "beat willpower every single time."}

  - id: loop
    type: neonline
    bars: 2
    transition: flash
    caption: "Cue. Craving. Routine. Reward."
    params:
      kicker: "The habit loop"
      title: "FOUR STEPS, *ON REPEAT*"
      at: 1.2
      seg: 0.62
      steps:
        - {label: Cue, icon: bell}
        - {label: Craving, icon: flame}
        - {label: Routine, icon: repeat}
        - {label: Reward, icon: star}

  - id: wins
    type: coinflip
    bars: 2
    transition: flip
    caption: "Make it too small to skip."
    params:
      title: "STACK TINY *WINS*"
      sub: "Small enough that you never skip."
      at: 1.6
      gap: 0.9
      items:
        - {icon: clock, label: "2 min"}
        - {icon: check, label: "Daily"}
        - {icon: trophy, label: "Streak"}

  - id: repeat
    type: tunnel                      # glow style = push-through: the camera flies through the tunnel at the end
    bars: 2
    transition: zoom
    caption: "Repeat until it runs itself."
    params:
      kicker: "Then"
      title: "REPEAT UNTIL IT'S *AUTOMATIC*"
      reveal: 1.2

  - id: close
    type: cone
    bars: 2
    transition: defocus
    camera_from: prev                 # starts where the push-through ended and pulls back into the spotlight
    camera_blend: 1.2
    params:
      kicker: "Habit Lab"
      title: "START SMALL.\nSTART *TODAY.*"
      at: 0.4

thumbnail: {kicker: "Habit Lab", title: "How a habit forms", accent: habit, badge: "26 s"}
