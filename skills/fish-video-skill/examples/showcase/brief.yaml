# Showcase: the "looks" scene set in one silent Short (no narration, no TTS).
#   fishvideo stills examples/showcase --scenes      (copy it somewhere first; the build writes into the project)
# A generic, original topic; the images in assets/ are simple placeholder drawings.
title: "How a habit forms"
prompt: "A ~24 second silent Short on how a habit forms: paper collage, a split reveal, a neon habit loop, coin-flip tiny wins, a glow tunnel, pop captions."
goal: explain
structure: explainer
length: 24
platforms: [shorts]
language: en-IN
tone: "punchy, visual, no narration"
texture: paper            # paper | grain | clean | grid | blueprint
sfx: {density: standard}  # rich | standard | minimal
captions: {burn: true, style: pop}
brand:
  name: Habit Lab
  url: habitlab.example
  tagline: "Small loops, big change."
  mode: light
  colors: {bg: "#d6d6d6", surface: "#f2f2f2", paper: "#e9e9e9", ink: "#111111", fg: "#141414", muted: "#4a4a4a", dim: "#7a7a7a", accent: "#FF5A1F", accent2: "#1FB6FF"}
  fonts: {sans: Inter, serif: Fraunces, mono: JetBrains Mono, hand: Caveat}
voice:
  provider: none
hashtags: [Habits, FishVideo, Shorts]
